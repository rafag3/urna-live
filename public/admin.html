<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Urna Live — Painel</title>
<style>
  body{font-family:system-ui,sans-serif;background:#111;color:#eee;max-width:520px;margin:24px auto;padding:0 16px}
  h1{font-size:22px} .box{background:#1d1d1f;border-radius:12px;padding:16px;margin:12px 0}
  button{font-size:16px;padding:10px 16px;border-radius:8px;border:0;cursor:pointer;margin:4px 4px 4px 0}
  .r{background:#c0392b;color:#fff} .g{background:#27ae60;color:#fff} .n{background:#444;color:#fff}
  input{font-size:16px;width:80px;padding:8px;border-radius:8px;border:1px solid #444;background:#000;color:#fff}
  #placar{font-size:28px;font-weight:800} #st{color:#aaa}
</style>
</head>
<body>
<h1>Painel da Urna</h1>
<div class="box"><div id="st">conectando…</div><div id="placar">—</div></div>
<div class="box">
  <div style="margin-bottom:8px">Jogo na tela (troca ao vivo):</div>
  <div id="jogos"></div>
</div>
<div class="box">
  <div>Votos manuais: <input id="qtd" type="number" value="1" min="1" max="1000"></div>
  <div id="manuais"></div>
</div>
<div class="box">
  <button class="r" id="reset">Zerar placar / nova rodada</button>
  <button class="n" id="reload">Recarregar config.json</button>
  <button class="g" id="pular" style="display:none">Pular / revelar agora</button>
</div>
<script>
  const $ = (id) => document.getElementById(id);
  let ws;
  function con() {
    const k = new URLSearchParams(location.search).get('k') || '';
    ws = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/ws${k ? '?k=' + encodeURIComponent(k) : ''}`);
    ws.onmessage = (e) => {
      const m = JSON.parse(e.data);
      if (m.type === 'status') $('st').textContent = 'TikTok: ' + m.conexao;
      if (m.type === 'modo') {
        const box = $('jogos'); box.replaceChildren();
        Object.entries(m.jogos || {}).forEach(([k, nome]) => {
          const b = document.createElement('button'); b.className = k === m.modo ? 'g' : 'n'; b.textContent = (k === m.modo ? '● ' : '') + nome;
          b.onclick = () => { if (k !== m.modo && confirm('Trocar o jogo para ' + nome + '?')) ws.send(JSON.stringify({ cmd: 'jogo', modo: k })); };
          box.appendChild(b);
        });
        return;
      }
      if (m.type === 'milhao') {
        $('st').textContent = 'TikTok: ' + (m.conexao || '…') + ' · rodada ' + m.rodada + ' · ' + m.escada[m.degrau] + ' (' + m.fase + ')';
        $('placar').textContent = (m.pergunta ? m.pergunta.pergunta : '') + '  —  vivos ' + m.vivos + ' · fora ' + m.eliminados;
        $('manuais').textContent = 'Modo Milhão: votos manuais desativados.';
        $('pular').style.display = '';
        return;
      }
      if (m.type === 'quiz') {
        $('st').textContent = 'TikTok: ' + (m.conexao || '…') + ' · pergunta ' + m.numero + ' (' + m.fase + ')';
        $('placar').textContent = (m.pergunta ? m.pergunta.afirmacao : '') + '  —  V ' + m.votos.V + ' x F ' + m.votos.F;
        $('manuais').textContent = 'Modo quiz: votos manuais desativados.';
        $('pular').style.display = '';
        return;
      }
      if (m.type !== 'state') return;
      $('pular').style.display = 'none';
      $('st').textContent = 'TikTok: ' + m.conexao + ' · rodada ' + m.rodada;
      $('placar').textContent = m.config.opcoes.map((o) => `${o.nome}: ${m.votos[o.numero]}`).join('   ·   ');
      const box = $('manuais'); if (box.childElementCount) return;
      m.config.opcoes.forEach((o) => {
        const b = document.createElement('button'); b.className = 'g'; b.textContent = '+ ' + o.nome;
        b.onclick = () => ws.send(JSON.stringify({ cmd: 'manual', numero: o.numero, votos: Number($('qtd').value) }));
        box.appendChild(b);
      });
    };
    ws.onclose = () => { $('st').textContent = 'servidor offline, reconectando…'; setTimeout(con, 1500); };
  }
  con();
  $('reset').onclick = () => confirm('Zerar o placar / ranking?') && ws.send(JSON.stringify({ cmd: 'reset' }));
  $('pular').onclick = () => ws.send(JSON.stringify({ cmd: 'pular' }));
  $('reload').onclick = () => ws.send(JSON.stringify({ cmd: 'reload-config' }));
</script>
</body>
</html>
